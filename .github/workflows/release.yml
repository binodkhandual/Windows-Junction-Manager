name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $cleanVersion = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$cleanVersion" >> $env:GITHUB_OUTPUT

      - name: Build and Publish Single-File Executable
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $tag = "${{ steps.get_version.outputs.tag }}"
          
          dotnet publish JunctionManagerWpf/JunctionManager.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishSingleFile=true `
            -p:Version=$ver `
            --self-contained false `
            -o dist
            
          # Rename output to include version and architecture
          Copy-Item "dist/JunctionManager.exe" "dist/JunctionManager-${tag}-win-x64.exe"
          Get-ChildItem dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Junction Manager ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/JunctionManager-${{ steps.get_version.outputs.tag }}-win-x64.exe
            dist/JunctionManager.exe
